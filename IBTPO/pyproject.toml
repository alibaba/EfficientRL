[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibtpo-demo"
version = "0.1.0"
description = "Standalone IBTree structured sampling demo for IBTPO"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "vllm>=0.11.0",
  "transformers>=4.57.0",
  "math-verify>=0.8.0",
  "latex2sympy2-extended>=1.10.0",
]

[project.scripts]
ibtpo-demo = "opensource_ibtpo.demo:main"

[tool.setuptools]
packages = ["opensource_ibtpo"]

[tool.setuptools.package-dir]
opensource_ibtpo = "."
